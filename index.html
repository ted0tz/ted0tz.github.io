<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  :root {
    --bg1: #0b1f0f;
    --bg2: #143d1c;
    --bg3: #061006;
    --accent: #4ade80;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 70%, var(--bg3) 100%);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .logo {
    width: min(500px, 80vw);
    height: auto;
    margin-bottom: 30px;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 1px;
  }
  h1 span {
    font-weight: 700;
    color: var(--accent);
  }
  .countdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .block {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 25px 20px;
    min-width: 110px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .number {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
  }
  .finished {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    color: var(--accent);
    font-weight: 700;
  }
  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    opacity: 0.5;
  }

  /* Zahnrad-Button */
  .settings-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    transition: transform 0.4s ease, background 0.2s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .settings-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: rotate(45deg);
  }

  /* Overlay + Panel */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .overlay.open {
    display: flex;
  }
  .panel {
    background: linear-gradient(160deg, #0d2412, #071008);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .panel h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0.6;
    line-height: 1;
  }
  .close-btn:hover {
    opacity: 1;
  }
  .skin-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .skin-input-row input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .skin-input-row input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }
  .skin-input-row input:focus {
    border-color: var(--accent);
  }
  .skin-btn {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #06210c;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: filter 0.2s ease;
  }
  .skin-btn:hover {
    filter: brightness(1.1);
  }
  .skin-viewer-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 30%, rgba(74,222,128,0.08), rgba(0,0,0,0.35));
    border-radius: 14px;
    min-height: 320px;
    margin-bottom: 8px;
    position: relative;
    cursor: grab;
  }
  .skin-viewer-wrap:active {
    cursor: grabbing;
  }
  .skin-hint {
    font-size: 0.75rem;
    opacity: 0.45;
    margin-bottom: 14px;
  }
  #skin_canvas {
    border-radius: 14px;
  }
  .skin-status {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 14px;
    min-height: 1.2em;
  }
  .skin-status.error {
    color: #ff8a8a;
    opacity: 1;
  }
  .download-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    display: none;
  }
  .download-btn:hover {
    background: rgba(74, 222, 128, 0.12);
  }
</style>
</head>
<body>

<!-- Zahnrad-Button oben rechts -->
<button class="settings-btn" id="settingsBtn" title="Einstellungen" aria-label="Einstellungen öffnen">⚙️</button>

<!-- Skin-Panel -->
<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close-btn" id="closeBtn" aria-label="Schließen">✕</button>
    <h2>Skins</h2>

    <div class="skin-input-row">
      <input type="text" id="usernameInput" placeholder="Minecraft-Benutzername" autocomplete="off">
      <button class="skin-btn" id="loadSkinBtn">Anzeigen</button>
    </div>

    <div class="skin-status" id="skinStatus"></div>

    <div class="skin-viewer-wrap">
      <canvas id="skin_canvas" width="280" height="360"></canvas>
    </div>
    <div class="skin-hint">Zum Drehen ziehen, mit dem Mausrad zoomen</div>

    <button class="download-btn" id="downloadBtn">Skin herunterladen</button>
  </div>
</div>

<img src="logo.png" alt="KIWI2 Server Logo" class="logo">

<h1>Countdown until Launch of KIWI2:</h1>

<div class="countdown" id="countdown">
  <div class="block">
    <div class="number" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="block">
    <div class="number" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="block">
    <div class="number" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="block">
    <div class="number" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<footer>Wird automatisch aktualisiert</footer>

<script>
  // Zieldatum: 26.09.2026, 16:00 Uhr (lokale Zeitzone des Betrachters)
  const targetDate = new Date(2026, 8, 26, 16, 0, 0).getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      countdownEl.innerHTML = '<div class="finished">🎉 Das Ereignis hat begonnen! 🎉</div>';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);
</script>

<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const usernameInput = document.getElementById('usernameInput');
  const loadSkinBtn = document.getElementById('loadSkinBtn');
  const skinStatus = document.getElementById('skinStatus');
  const downloadBtn = document.getElementById('downloadBtn');
  const viewerWrap = document.querySelector('.skin-viewer-wrap');
  const canvas = document.getElementById('skin_canvas');

  settingsBtn.addEventListener('click', () => overlay.classList.add('open'));
  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  function setStatus(text, isError) {
    skinStatus.textContent = text;
    skinStatus.classList.toggle('error', !!isError);
  }
</script>

<!-- Three.js Kernbibliothek (zuverlässiges CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    setStatus('3D-Bibliothek konnte nicht geladen werden.', true);
    return;
  }

  const TEX_SIZE = 64;

  // ---- UV-Hilfsfunktion: ordnet einem BoxGeometry-Würfel die passenden
  // Ausschnitte aus der 64x64-Skin-Textur zu (Reihenfolge: links, rechts, oben, unten, vorne, hinten)
  function applyUV(geometry, regions) {
    const uv = geometry.attributes.uv;
    for (let face = 0; face < 6; face++) {
      const r = regions[face];
      const u0 = r.x / TEX_SIZE;
      const u1 = (r.x + r.w) / TEX_SIZE;
      const v0 = 1 - r.y / TEX_SIZE;
      const v1 = 1 - (r.y + r.h) / TEX_SIZE;
      const base = face * 4;
      uv.setXY(base + 0, u0, v0);
      uv.setXY(base + 1, u1, v0);
      uv.setXY(base + 2, u0, v1);
      uv.setXY(base + 3, u1, v1);
    }
    uv.needsUpdate = true;
  }

  function rect(x, y, w, h) { return { x, y, w, h }; }

  const UV = {
    head: [rect(16,8,8,8), rect(0,8,8,8), rect(8,0,8,8), rect(16,0,8,8), rect(8,8,8,8), rect(24,8,8,8)],
    body: [rect(28,20,4,12), rect(16,20,4,12), rect(20,16,8,4), rect(28,16,8,4), rect(20,20,8,12), rect(32,20,8,12)],
    armR: [rect(48,20,4,12), rect(40,20,4,12), rect(44,16,4,4), rect(48,16,4,4), rect(44,20,4,12), rect(52,20,4,12)],
    armL: [rect(40,52,4,12), rect(32,52,4,12), rect(36,48,4,4), rect(40,48,4,4), rect(36,52,4,12), rect(44,52,4,12)],
    legR: [rect(8,20,4,12), rect(0,20,4,12), rect(4,16,4,4), rect(8,16,4,4), rect(4,20,4,12), rect(12,20,4,12)],
    legL: [rect(24,52,4,12), rect(16,52,4,12), rect(20,48,4,4), rect(24,48,4,4), rect(20,52,4,12), rect(28,52,4,12)]
  };

  // ---- Platzhalter-Textur (farbige Blöcke), damit sofort etwas zu sehen ist,
  // auch bevor/ohne dass ein echter Minecraft-Skin geladen wurde.
  function buildPlaceholderTexture() {
    const c = document.createElement('canvas');
    c.width = TEX_SIZE; c.height = TEX_SIZE;
    const ctx = c.getContext('2d');
    function fill(r, color) { ctx.fillStyle = color; ctx.fillRect(r.x, r.y, r.w, r.h); }
    const skin = '#e0a97a', hair = '#4a3222', shirt = '#4ade80', shirtDark = '#33a35b', pants = '#2b3a55';
    UV.head.forEach(r => fill(r, skin));
    fill(rect(8,0,8,8), hair); // Haar oben
    UV.body.forEach(r => fill(r, shirt));
    UV.armR.forEach(r => fill(r, shirt));
    UV.armL.forEach(r => fill(r, shirt));
    fill(rect(44,20,4,3), skin); fill(rect(36,52,4,3), skin); // "Hände" angedeutet
    UV.legR.forEach(r => fill(r, pants));
    UV.legL.forEach(r => fill(r, pants));
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    return tex;
  }

  // ---- Szene aufbauen ----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 280 / 360, 0.1, 1000);
  camera.position.set(0, 20, 62);
  camera.lookAt(0, 16, 0);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setSize(280, 360, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(3, 6, 5);
  scene.add(dirLight);

  let currentTexture = buildPlaceholderTexture();
  let material = new THREE.MeshLambertMaterial({ map: currentTexture, transparent: true, alphaTest: 0.2 });

  function box(w, h, d, regions) {
    const geo = new THREE.BoxGeometry(w, h, d);
    applyUV(geo, regions);
    return new THREE.Mesh(geo, material);
  }

  const player = new THREE.Group();
  scene.add(player);

  // Kopf
  const headPivot = new THREE.Group();
  headPivot.position.set(0, 24, 0);
  const headMesh = box(8, 8, 8, UV.head);
  headMesh.position.set(0, 4, 0);
  headPivot.add(headMesh);
  player.add(headPivot);

  // Körper
  const bodyMesh = box(8, 12, 4, UV.body);
  bodyMesh.position.set(0, 18, 0);
  player.add(bodyMesh);

  // Arme (Pivot an der Schulter)
  const armRPivot = new THREE.Group();
  armRPivot.position.set(-6, 24, 0);
  const armRMesh = box(4, 12, 4, UV.armR);
  armRMesh.position.set(0, -6, 0);
  armRPivot.add(armRMesh);
  player.add(armRPivot);

  const armLPivot = new THREE.Group();
  armLPivot.position.set(6, 24, 0);
  const armLMesh = box(4, 12, 4, UV.armL);
  armLMesh.position.set(0, -6, 0);
  armLPivot.add(armLMesh);
  player.add(armLPivot);

  // Beine (Pivot an der Hüfte)
  const legRPivot = new THREE.Group();
  legRPivot.position.set(-2, 12, 0);
  const legRMesh = box(4, 12, 4, UV.legR);
  legRMesh.position.set(0, -6, 0);
  legRPivot.add(legRMesh);
  player.add(legRPivot);

  const legLPivot = new THREE.Group();
  legLPivot.position.set(2, 12, 0);
  const legLMesh = box(4, 12, 4, UV.legL);
  legLMesh.position.set(0, -6, 0);
  legLPivot.add(legLMesh);
  player.add(legLPivot);

  // ---- Coole Pose: breiter Stand, Arme angewinkelt nach vorne/oben, Kopf leicht gedreht ----
  headPivot.rotation.y = 0.28;
  headPivot.rotation.x = -0.05;

  armRPivot.rotation.x = -0.95;
  armRPivot.rotation.z = 0.25;
  armLPivot.rotation.x = -0.55;
  armLPivot.rotation.z = -0.4;

  legRPivot.rotation.z = 0.18;
  legLPivot.rotation.z = -0.22;
  legLPivot.rotation.x = 0.12;

  player.position.y = -18;
  player.rotation.y = -0.5;

  // ---- Maus-/Touch-Steuerung zum Drehen + Zoomen ----
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let autoRotate = true;
  let zoom = 62;

  function onDown(x, y) { isDragging = true; autoRotate = false; lastX = x; lastY = y; }
  function onMove(x, y) {
    if (!isDragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    player.rotation.y += dx * 0.01;
    player.rotation.x = Math.max(-0.5, Math.min(0.5, player.rotation.x + dy * 0.01));
    lastX = x; lastY = y;
  }
  function onUp() { isDragging = false; }

  viewerWrap.addEventListener('mousedown', (e) => onDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);
  viewerWrap.addEventListener('touchstart', (e) => { const t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: true });
  viewerWrap.addEventListener('touchmove', (e) => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
  viewerWrap.addEventListener('touchend', onUp);
  viewerWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom = Math.max(35, Math.min(110, zoom + e.deltaY * 0.05));
    camera.position.z = zoom;
  }, { passive: false });

  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) player.rotation.y += 0.006;
    renderer.render(scene, camera);
  }
  animate();

  setStatus('Bereit. Benutzernamen eingeben und "Anzeigen" klicken.', false);

  // ---- Skin für einen Benutzernamen laden ----
  let currentSkinUrl = null;
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  function loadSkinForUser(username) {
    username = username.trim();
    if (!username) {
      setStatus('Bitte einen Benutzernamen eingeben.', true);
      return;
    }

    setStatus('Lade Skin für "' + username + '" …', false);
    downloadBtn.style.display = 'none';

    const skinUrl = 'https://mc-heads.net/skin/' + encodeURIComponent(username) + '?_=' + Date.now();

    loader.load(
      skinUrl,
      (tex) => {
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        material.map = tex;
        material.needsUpdate = true;
        if (currentTexture) currentTexture.dispose();
        currentTexture = tex;
        currentSkinUrl = skinUrl;
        setStatus('Skin von "' + username + '" geladen.', false);
        downloadBtn.style.display = 'block';
      },
      undefined,
      () => {
        setStatus('Skin konnte nicht geladen werden. Benutzernamen prüfen (oder Sandbox blockiert externe Bilder – auf GitHub Pages funktioniert es).', true);
      }
    );
  }

  loadSkinBtn.addEventListener('click', () => loadSkinForUser(usernameInput.value));
  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadSkinForUser(usernameInput.value);
  });

  downloadBtn.addEventListener('click', async () => {
    if (!currentSkinUrl) return;
    try {
      const response = await fetch(currentSkinUrl, { mode: 'cors' });
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = (usernameInput.value.trim() || 'skin') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
    } catch (err) {
      window.open(currentSkinUrl, '_blank');
    }
  });
})();
</script>

</body>
</html>
