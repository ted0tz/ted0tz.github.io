<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  :root {
    --bg1: #0b1f0f;
    --bg2: #143d1c;
    --bg3: #061006;
    --accent: #4ade80;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 70%, var(--bg3) 100%);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .logo {
    width: min(500px, 80vw);
    height: auto;
    margin-bottom: 30px;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 1px;
  }
  h1 span {
    font-weight: 700;
    color: var(--accent);
  }
  .countdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .block {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 25px 20px;
    min-width: 110px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .number {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
  }
  .finished {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    color: var(--accent);
    font-weight: 700;
  }
  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    opacity: 0.5;
  }

  /* Zahnrad-Button */
  .settings-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    transition: transform 0.4s ease, background 0.2s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .settings-btn:hover {
    background: rgba(255, 255, 255, 0.15);
  }
  .settings-btn.open {
    transform: rotate(75deg);
    background: var(--accent);
    color: #06210c;
  }

  /* Fächer-Menü */
  .fab-menu {
    position: fixed;
    top: 82px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 150;
  }
  .fab-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(13, 36, 18, 0.85);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transform: translateX(30px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
  }
  .fab-option:hover {
    background: rgba(74, 222, 128, 0.18);
    border-color: var(--accent);
  }
  .fab-menu.open .fab-option {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }
  .fab-menu.open .fab-option:nth-child(1) { transition-delay: 0.03s; }
  .fab-menu.open .fab-option:nth-child(2) { transition-delay: 0.11s; }

  /* Vollbild-Ansichten */
  .fullscreen-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #0d2412, #051006 60%, #071008);
    z-index: 300;
    display: none;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    padding: 70px 20px 50px;
  }
  .fullscreen-overlay.open {
    display: flex;
  }
  .fullscreen-close {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 310;
  }
  .fullscreen-close:hover {
    background: rgba(255, 255, 255, 0.18);
  }
  .fs-content {
    width: 100%;
    max-width: 480px;
  }
  .fs-content h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--accent);
    text-align: center;
  }

  /* Upload-Bereich */
  .upload-area {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 16px;
    border: 2px dashed rgba(255, 255, 255, 0.25);
    border-radius: 14px;
    cursor: pointer;
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 16px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .upload-area:hover {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.06);
  }
  .upload-area.dragover {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.12);
  }

  .mapart-preview-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .mapart-preview {
    max-width: 100%;
    max-height: 220px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .url-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .url-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 0.8rem;
  }

  .skin-btn {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #06210c;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: filter 0.2s ease;
    white-space: nowrap;
  }
  .skin-btn:hover {
    filter: brightness(1.1);
  }
  .skin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .skin-viewer-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 30%, rgba(74,222,128,0.08), rgba(0,0,0,0.35));
    border-radius: 14px;
    min-height: 340px;
    margin-bottom: 8px;
    position: relative;
    cursor: grab;
  }
  .skin-viewer-wrap:active {
    cursor: grabbing;
  }
  .skin-hint {
    font-size: 0.75rem;
    opacity: 0.45;
    margin-bottom: 14px;
    text-align: center;
  }
  #head_canvas {
    border-radius: 14px;
  }
  .skin-status {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 14px;
    min-height: 1.2em;
  }
  .skin-status.error {
    color: #ff8a8a;
    opacity: 1;
  }
  .download-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    display: none;
  }
  .download-btn:hover {
    background: rgba(74, 222, 128, 0.12);
  }
</style>
</head>
<body>

<!-- Zahnrad-Button oben rechts -->
<button class="settings-btn" id="settingsBtn" title="Einstellungen" aria-label="Einstellungen öffnen">⚙️</button>

<!-- Fächer-Menü -->
<div class="fab-menu" id="fabMenu">
  <button class="fab-option" id="openMapartBtn">🗺️ Mapart</button>
  <button class="fab-option" id="openHeadsBtn">🧑 Heads</button>
</div>

<!-- Vollbild: Mapart -->
<div class="fullscreen-overlay" id="mapartOverlay">
  <button class="fullscreen-close" id="mapartCloseBtn" aria-label="Schließen">✕</button>
  <div class="fs-content">
    <h2>Mapart</h2>

    <label class="upload-area" id="mapartDropArea" for="mapartFile">
      <input type="file" id="mapartFile" accept="image/*" hidden>
      <span>Bild auswählen oder hierher ziehen</span>
    </label>

    <div class="mapart-preview-wrap" id="mapartPreviewWrap" style="display:none">
      <img id="mapartPreview" class="mapart-preview" alt="Vorschau">
    </div>

    <div class="url-row" id="mapartUrlRow" style="display:none">
      <input type="text" id="mapartUrlOutput" readonly>
      <button class="skin-btn" id="mapartCopyBtn">Kopieren</button>
    </div>

    <div class="skin-status" id="mapartStatus">Wähle ein Bild aus – es wird hochgeladen und du bekommst einen öffentlichen Link, den auch andere öffnen können.</div>
  </div>
</div>

<!-- Vollbild: Heads -->
<div class="fullscreen-overlay" id="headsOverlay">
  <button class="fullscreen-close" id="headsCloseBtn" aria-label="Schließen">✕</button>
  <div class="fs-content">
    <h2>Heads</h2>

    <label class="upload-area" id="headsDropArea" for="headsFile">
      <input type="file" id="headsFile" accept="image/png,.png" hidden>
      <span>Minecraft-Skin-Datei (.png) auswählen</span>
    </label>

    <div class="skin-status" id="headsStatus">Wähle eine Skin-Datei aus.</div>

    <div class="skin-viewer-wrap" id="headViewerWrap">
      <canvas id="head_canvas" width="320" height="340"></canvas>
    </div>
    <div class="skin-hint">Zum Drehen ziehen</div>

    <button class="download-btn" id="headsDownloadBtn">Skin-Datei herunterladen</button>
    <button class="download-btn" id="headsUploadBtn" style="margin-top:10px;">Für andere hochladen (öffentlicher Link)</button>
    <div class="url-row" id="headsUrlRow" style="display:none; margin-top:10px;">
      <input type="text" id="headsUrlOutput" readonly>
      <button class="skin-btn" id="headsCopyBtn">Kopieren</button>
    </div>
  </div>
</div>

<img src="logo.png" alt="KIWI2 Server Logo" class="logo">

<h1>Countdown until Launch of KIWI2:</h1>

<div class="countdown" id="countdown">
  <div class="block">
    <div class="number" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="block">
    <div class="number" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="block">
    <div class="number" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="block">
    <div class="number" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<footer>Wird automatisch aktualisiert</footer>

<script>
  // Zieldatum: 26.09.2026, 16:00 Uhr (lokale Zeitzone des Betrachters)
  const targetDate = new Date(2026, 8, 26, 16, 0, 0).getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      countdownEl.innerHTML = '<div class="finished">🎉 Das Ereignis hat begonnen! 🎉</div>';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);
</script>

<script>
  // =========================================================
  // WICHTIG: Für ECHTE öffentliche Upload-Links brauchst du einen
  // kostenlosen imgbb API-Key: https://api.imgbb.com/ (gratis, ohne
  // Kreditkarte). Trag ihn hier ein:
  // =========================================================
  const IMGBB_API_KEY = 'b6d853bb16194908d49977d9ea72f25a';

  const settingsBtn = document.getElementById('settingsBtn');
  const fabMenu = document.getElementById('fabMenu');
  const mapartOverlay = document.getElementById('mapartOverlay');
  const headsOverlay = document.getElementById('headsOverlay');
  const openMapartBtn = document.getElementById('openMapartBtn');
  const openHeadsBtn = document.getElementById('openHeadsBtn');
  const mapartCloseBtn = document.getElementById('mapartCloseBtn');
  const headsCloseBtn = document.getElementById('headsCloseBtn');

  function closeFab() {
    fabMenu.classList.remove('open');
    settingsBtn.classList.remove('open');
  }

  settingsBtn.addEventListener('click', () => {
    const isOpen = fabMenu.classList.toggle('open');
    settingsBtn.classList.toggle('open', isOpen);
  });

  openMapartBtn.addEventListener('click', () => {
    closeFab();
    mapartOverlay.classList.add('open');
  });
  openHeadsBtn.addEventListener('click', () => {
    closeFab();
    headsOverlay.classList.add('open');
  });
  mapartCloseBtn.addEventListener('click', () => mapartOverlay.classList.remove('open'));
  headsCloseBtn.addEventListener('click', () => headsOverlay.classList.remove('open'));

  // Fächer-Menü schließen, wenn man daneben klickt
  document.addEventListener('click', (e) => {
    if (!fabMenu.contains(e.target) && e.target !== settingsBtn && fabMenu.classList.contains('open')) {
      closeFab();
    }
  });

  // ---- Echter Upload zu imgbb (öffentliche Bild-URL) ----
  async function uploadToImgbb(file) {
    if (!IMGBB_API_KEY || IMGBB_API_KEY === 'DEIN_IMGBB_API_KEY_HIER') {
      throw new Error('NO_API_KEY');
    }
    const formData = new FormData();
    formData.append('image', file);
    const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    if (!data.success) throw new Error('UPLOAD_FAILED');
    return data.data.url;
  }

  function setupDropArea(area, input, onFile) {
    area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
    area.addEventListener('dragleave', () => area.classList.remove('dragover'));
    area.addEventListener('drop', (e) => {
      e.preventDefault();
      area.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
    });
    input.addEventListener('change', () => {
      if (input.files && input.files[0]) onFile(input.files[0]);
    });
  }

  // =========================================================
  // MAPART: Bild hochladen -> echte öffentliche Bild-URL
  // =========================================================
  const mapartDropArea = document.getElementById('mapartDropArea');
  const mapartFile = document.getElementById('mapartFile');
  const mapartPreviewWrap = document.getElementById('mapartPreviewWrap');
  const mapartPreview = document.getElementById('mapartPreview');
  const mapartUrlRow = document.getElementById('mapartUrlRow');
  const mapartUrlOutput = document.getElementById('mapartUrlOutput');
  const mapartCopyBtn = document.getElementById('mapartCopyBtn');
  const mapartStatus = document.getElementById('mapartStatus');

  async function handleMapartFile(file) {
    if (!file.type.startsWith('image/')) {
      mapartStatus.textContent = 'Bitte eine Bilddatei auswählen.';
      mapartStatus.classList.add('error');
      return;
    }
    mapartStatus.classList.remove('error');
    mapartUrlRow.style.display = 'none';

    // Lokale Vorschau sofort anzeigen, während hochgeladen wird
    const localReader = new FileReader();
    localReader.onload = () => {
      mapartPreview.src = localReader.result;
      mapartPreviewWrap.style.display = 'flex';
    };
    localReader.readAsDataURL(file);

    mapartStatus.textContent = 'Bild wird hochgeladen …';

    try {
      const publicUrl = await uploadToImgbb(file);
      mapartUrlOutput.value = publicUrl;
      mapartUrlRow.style.display = 'flex';
      mapartStatus.textContent = 'Fertig! Das ist dein öffentlicher Link – jeder kann ihn öffnen.';
    } catch (err) {
      if (err.message === 'NO_API_KEY') {
        mapartStatus.textContent = 'Kein imgbb-API-Key hinterlegt. Öffentliche Uploads sind noch nicht eingerichtet (siehe Kommentar im Code).';
      } else {
        mapartStatus.textContent = 'Upload fehlgeschlagen. Bitte erneut versuchen.';
      }
      mapartStatus.classList.add('error');
    }
  }

  setupDropArea(mapartDropArea, mapartFile, handleMapartFile);

  mapartCopyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(mapartUrlOutput.value);
      mapartCopyBtn.textContent = 'Kopiert!';
      setTimeout(() => { mapartCopyBtn.textContent = 'Kopieren'; }, 1500);
    } catch (err) {
      mapartUrlOutput.select();
      document.execCommand('copy');
    }
  });
</script>

<!-- Three.js Kernbibliothek (zuverlässiges CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const headsDropArea = document.getElementById('headsDropArea');
  const headsFile = document.getElementById('headsFile');
  const headsStatus = document.getElementById('headsStatus');
  const headsDownloadBtn = document.getElementById('headsDownloadBtn');
  const headsUploadBtn = document.getElementById('headsUploadBtn');
  const headsUrlRow = document.getElementById('headsUrlRow');
  const headsUrlOutput = document.getElementById('headsUrlOutput');
  const headsCopyBtn = document.getElementById('headsCopyBtn');
  const headViewerWrap = document.getElementById('headViewerWrap');
  const canvas = document.getElementById('head_canvas');

  if (typeof THREE === 'undefined') {
    headsStatus.textContent = '3D-Bibliothek konnte nicht geladen werden.';
    headsStatus.classList.add('error');
    return;
  }

  // ---- UV-Regionen für den Kopf (links, rechts, oben, unten, vorne, hinten) ----
  function rect(x, y, w, h) { return { x, y, w, h }; }
  const HEAD_UV = [rect(16,8,8,8), rect(0,8,8,8), rect(8,0,8,8), rect(16,0,8,8), rect(8,8,8,8), rect(24,8,8,8)];

  function applyUV(geometry, regions, texW, texH) {
    const uv = geometry.attributes.uv;
    for (let face = 0; face < 6; face++) {
      const r = regions[face];
      const u0 = r.x / texW;
      const u1 = (r.x + r.w) / texW;
      const v0 = 1 - r.y / texH;
      const v1 = 1 - (r.y + r.h) / texH;
      const base = face * 4;
      uv.setXY(base + 0, u0, v0);
      uv.setXY(base + 1, u1, v0);
      uv.setXY(base + 2, u0, v1);
      uv.setXY(base + 3, u1, v1);
    }
    uv.needsUpdate = true;
  }

  // ---- Platzhalter-Textur (neutral grau) ----
  function buildPlaceholderTexture() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#4b5563';
    HEAD_UV.forEach((r, i) => { if (i % 2 === 0) ctx.fillRect(r.x, r.y, r.w / 2, r.h); });
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    return tex;
  }

  // ---- Szene ----
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
  camera.position.set(0, 0, 26);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setSize(240, 240, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.95));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
  dirLight.position.set(3, 6, 5);
  scene.add(dirLight);

  let currentTexture = buildPlaceholderTexture();
  const geo = new THREE.BoxGeometry(8, 8, 8);
  applyUV(geo, HEAD_UV, 64, 64);
  const material = new THREE.MeshLambertMaterial({ map: currentTexture, transparent: true, alphaTest: 0.2 });
  const headMesh = new THREE.Mesh(geo, material);
  scene.add(headMesh);

  // ---- Maus-/Touch-Steuerung zum Drehen ----
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let autoRotate = true;

  function onDown(x, y) { isDragging = true; autoRotate = false; lastX = x; lastY = y; }
  function onMove(x, y) {
    if (!isDragging) return;
    const dx = x - lastX;
    const dy = y - lastY;
    headMesh.rotation.y += dx * 0.012;
    headMesh.rotation.x = Math.max(-0.6, Math.min(0.6, headMesh.rotation.x + dy * 0.012));
    lastX = x; lastY = y;
  }
  function onUp() { isDragging = false; }

  headViewerWrap.addEventListener('mousedown', (e) => onDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);
  headViewerWrap.addEventListener('touchstart', (e) => { const t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: true });
  headViewerWrap.addEventListener('touchmove', (e) => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
  headViewerWrap.addEventListener('touchend', onUp);

  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) headMesh.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();

  // ---- Skin-Datei hochladen und Kopf-Textur daraus bauen ----
  let currentFile = null;

  function handleHeadsFile(file) {
    if (!file.type.includes('png') && !file.name.toLowerCase().endsWith('.png')) {
      headsStatus.textContent = 'Bitte eine PNG-Skin-Datei auswählen.';
      headsStatus.classList.add('error');
      return;
    }
    headsStatus.classList.remove('error');
    headsStatus.textContent = 'Skin wird geladen …';
    headsDownloadBtn.style.display = 'none';
    headsUploadBtn.style.display = 'none';
    headsUrlRow.style.display = 'none';

    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      const texW = img.naturalWidth;
      const texH = img.naturalHeight;

      const c = document.createElement('canvas');
      c.width = texW; c.height = texH;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;

      applyUV(geo, HEAD_UV, texW, texH);
      material.map = tex;
      material.needsUpdate = true;
      if (currentTexture) currentTexture.dispose();
      currentTexture = tex;

      currentFile = file;
      headsStatus.textContent = '"' + file.name + '" geladen – Kopf wird als 3D-Vorschau angezeigt.';
      headsDownloadBtn.style.display = 'block';
      headsUploadBtn.style.display = 'block';
      URL.revokeObjectURL(objectUrl);
    };
    img.onerror = () => {
      headsStatus.textContent = 'Datei konnte nicht als Bild gelesen werden.';
      headsStatus.classList.add('error');
      URL.revokeObjectURL(objectUrl);
    };
    img.src = objectUrl;
  }

  setupDropArea(headsDropArea, headsFile, handleHeadsFile);

  headsDownloadBtn.addEventListener('click', () => {
    if (!currentFile) return;
    const url = URL.createObjectURL(currentFile);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentFile.name || 'skin.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  headsUploadBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    headsUploadBtn.disabled = true;
    headsUploadBtn.textContent = 'Wird hochgeladen …';
    headsUrlRow.style.display = 'none';
    try {
      const publicUrl = await uploadToImgbb(currentFile);
      headsUrlOutput.value = publicUrl;
      headsUrlRow.style.display = 'flex';
      headsUploadBtn.textContent = 'Für andere hochladen (öffentlicher Link)';
    } catch (err) {
      if (err.message === 'NO_API_KEY') {
        headsStatus.textContent = 'Kein imgbb-API-Key hinterlegt. Öffentliche Uploads sind noch nicht eingerichtet.';
      } else {
        headsStatus.textContent = 'Upload fehlgeschlagen. Bitte erneut versuchen.';
      }
      headsStatus.classList.add('error');
      headsUploadBtn.textContent = 'Für andere hochladen (öffentlicher Link)';
    }
    headsUploadBtn.disabled = false;
  });

  headsCopyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(headsUrlOutput.value);
      headsCopyBtn.textContent = 'Kopiert!';
      setTimeout(() => { headsCopyBtn.textContent = 'Kopieren'; }, 1500);
    } catch (err) {
      headsUrlOutput.select();
      document.execCommand('copy');
    }
  });
})();
</script>
