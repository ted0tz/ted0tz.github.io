<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  :root {
    --bg1: #0b1f0f;
    --bg2: #143d1c;
    --bg3: #061006;
    --accent: #4ade80;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 70%, var(--bg3) 100%);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .logo {
    width: min(500px, 80vw);
    height: auto;
    margin-bottom: 30px;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 1px;
  }
  h1 span {
    font-weight: 700;
    color: var(--accent);
  }
  .countdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .block {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 25px 20px;
    min-width: 110px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .number {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
  }
  .finished {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    color: var(--accent);
    font-weight: 700;
  }
  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    opacity: 0.5;
  }

  /* Zahnrad-Button */
  .settings-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    color: var(--text);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    transition: transform 0.4s ease, background 0.2s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .settings-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: rotate(45deg);
  }

  /* Overlay + Panel */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .overlay.open {
    display: flex;
  }
  .panel {
    background: linear-gradient(160deg, #0d2412, #071008);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }
  .panel h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--accent);
  }
  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0.6;
    line-height: 1;
  }
  .close-btn:hover {
    opacity: 1;
  }
  .skin-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .skin-input-row input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .skin-input-row input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }
  .skin-input-row input:focus {
    border-color: var(--accent);
  }
  .skin-btn {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #06210c;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    transition: filter 0.2s ease;
  }
  .skin-btn:hover {
    filter: brightness(1.1);
  }
  .skin-viewer-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 14px;
    min-height: 300px;
    margin-bottom: 16px;
    position: relative;
  }
  #skin_canvas {
    border-radius: 14px;
  }
  .skin-status {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-bottom: 14px;
    min-height: 1.2em;
  }
  .skin-status.error {
    color: #ff8a8a;
    opacity: 1;
  }
  .download-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    display: none;
  }
  .download-btn:hover {
    background: rgba(74, 222, 128, 0.12);
  }
</style>
</head>
<body>

<!-- Zahnrad-Button oben rechts -->
<button class="settings-btn" id="settingsBtn" title="Einstellungen" aria-label="Einstellungen öffnen">⚙️</button>

<!-- Skin-Panel -->
<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close-btn" id="closeBtn" aria-label="Schließen">✕</button>
    <h2>Skins</h2>

    <div class="skin-input-row">
      <input type="text" id="usernameInput" placeholder="Minecraft-Benutzername" autocomplete="off">
      <button class="skin-btn" id="loadSkinBtn">Anzeigen</button>
    </div>

    <div class="skin-status" id="skinStatus"></div>

    <div class="skin-viewer-wrap">
      <canvas id="skin_canvas" width="260" height="340"></canvas>
    </div>

    <button class="download-btn" id="downloadBtn">Skin herunterladen</button>
  </div>
</div>

<img src="logo.png" alt="KIWI2 Server Logo" class="logo">

<h1>Countdown until Launch of KIWI2:</h1>

<div class="countdown" id="countdown">
  <div class="block">
    <div class="number" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="block">
    <div class="number" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="block">
    <div class="number" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="block">
    <div class="number" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<footer>Wird automatisch aktualisiert</footer>

<script>
  // Zieldatum: 26.09.2026, 16:00 Uhr (lokale Zeitzone des Betrachters)
  const targetDate = new Date(2026, 8, 26, 16, 0, 0).getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      countdownEl.innerHTML = '<div class="finished">🎉 Das Ereignis hat begonnen! 🎉</div>';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);
</script>

<!-- 3D-Skin-Viewer Bibliothek -->
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3/bundles/skinview3d.bundle.js"></script>
<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const usernameInput = document.getElementById('usernameInput');
  const loadSkinBtn = document.getElementById('loadSkinBtn');
  const skinStatus = document.getElementById('skinStatus');
  const downloadBtn = document.getElementById('downloadBtn');
  const canvas = document.getElementById('skin_canvas');

  let currentSkinUrl = null;

  // Panel öffnen / schließen
  settingsBtn.addEventListener('click', () => {
    overlay.classList.add('open');
  });
  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('open');
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  // 3D-Viewer initialisieren (mit Standard-Skin)
  const skinViewer = new skinview3d.SkinViewer({
    canvas: canvas,
    width: 260,
    height: 340,
    skin: "https://mc-heads.net/skin/MHF_Steve"
  });
  skinViewer.controls = skinview3d.createOrbitControls(skinViewer);
  skinViewer.controls.enableRotate = true;
  skinViewer.controls.enableZoom = true;
  skinViewer.controls.enablePan = false;
  skinViewer.autoRotate = true;
  skinViewer.autoRotateSpeed = 1.2;

  function setStatus(text, isError) {
    skinStatus.textContent = text;
    skinStatus.classList.toggle('error', !!isError);
  }

  async function loadSkinForUser(username) {
    username = username.trim();
    if (!username) {
      setStatus('Bitte einen Benutzernamen eingeben.', true);
      return;
    }

    setStatus('Lade Skin für "' + username + '" …', false);
    downloadBtn.style.display = 'none';

    const skinUrl = 'https://mc-heads.net/skin/' + encodeURIComponent(username);

    try {
      // Erst prüfen, ob der Skin geladen werden kann
      await new Promise((resolve, reject) => {
        const testImg = new Image();
        testImg.crossOrigin = 'anonymous';
        testImg.onload = resolve;
        testImg.onerror = reject;
        testImg.src = skinUrl;
      });

      skinViewer.loadSkin(skinUrl);
      currentSkinUrl = skinUrl;
      setStatus('Skin von "' + username + '" geladen.', false);
      downloadBtn.style.display = 'block';
    } catch (err) {
      setStatus('Skin konnte nicht geladen werden. Benutzername prüfen.', true);
    }
  }

  loadSkinBtn.addEventListener('click', () => loadSkinForUser(usernameInput.value));
  usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadSkinForUser(usernameInput.value);
  });

  downloadBtn.addEventListener('click', async () => {
    if (!currentSkinUrl) return;
    try {
      const response = await fetch(currentSkinUrl, { mode: 'cors' });
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = (usernameInput.value.trim() || 'skin') + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
    } catch (err) {
      // Fallback: Skin in neuem Tab öffnen, falls Download blockiert wird
      window.open(currentSkinUrl, '_blank');
    }
  });
</script>

</body>
</html>
