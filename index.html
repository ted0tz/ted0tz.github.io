<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<style>
  :root {
    --bg1: #0b1f0f;
    --bg2: #143d1c;
    --bg3: #061006;
    --accent: #4ade80;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 70%, var(--bg3) 100%);
    background-size: 300% 300%;
    animation: gradientShift 15s ease infinite;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .logo {
    width: min(500px, 80vw);
    height: auto;
    margin-bottom: 30px;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 40px;
    font-weight: 300;
    letter-spacing: 1px;
  }
  h1 span {
    font-weight: 700;
    color: var(--accent);
  }
  .countdown {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .block {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 25px 20px;
    min-width: 110px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .number {
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .label {
    margin-top: 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.75;
  }
  .finished {
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    color: var(--accent);
    font-weight: 700;
  }
  footer {
    margin-top: 50px;
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head>
<body>

<img src="logo.png" alt="KIWI2 Server Logo" class="logo">

<h1>Countdown until Launch of KIWI2:</h1>

<div class="countdown" id="countdown">
  <div class="block">
    <div class="number" id="days">00</div>
    <div class="label">Tage</div>
  </div>
  <div class="block">
    <div class="number" id="hours">00</div>
    <div class="label">Stunden</div>
  </div>
  <div class="block">
    <div class="number" id="minutes">00</div>
    <div class="label">Minuten</div>
  </div>
  <div class="block">
    <div class="number" id="seconds">00</div>
    <div class="label">Sekunden</div>
  </div>
</div>

<footer>Wird automatisch aktualisiert</footer>

<script>
  // Zieldatum: 26.09.2026, 16:00 Uhr (lokale Zeitzone des Betrachters)
  const targetDate = new Date(2026, 8, 26, 16, 0, 0).getTime();

  const daysEl = document.getElementById('days');
  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const countdownEl = document.getElementById('countdown');

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      countdownEl.innerHTML = '<div class="finished">🎉 Das Ereignis hat begonnen! 🎉</div>';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    daysEl.textContent = pad(days);
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);
</script>

</body>
</html>
